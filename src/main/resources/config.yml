bridge:
  host: 127.0.0.1
  port: 25580
  token: "change_me"
  read-timeout-ms: 15000

log-capture:
  # Execute as the real console, then return newly appended log lines.
  enabled: true
  # Used when the request wait time is negative; increase it for async commands.
  default-wait-ms: 1000
  max-wait-ms: 15000
  max-lines: 80
  # Relative paths are resolved from the server working directory.
  file-path: "logs/latest.log"

security:
  enable-ip-whitelist: false
  whitelist:
    - "127.0.0.1"
    - "::1"

messages:
  auth-failed: "AUTH_FAILED"
  forbidden-ip: "FORBIDDEN_IP"
  bad-request: "BAD_REQUEST"
  internal-error: "INTERNAL_ERROR"
